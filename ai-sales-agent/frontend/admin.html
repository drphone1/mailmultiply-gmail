<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Sales Agent - Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Admin Dashboard - Update Knowledge Base</h1>
        <form id="ingestForm" enctype="multipart/form-data">
            <div class="form-group">
                <label for="files">Upload Files (PDF, DOCX, TXT):</label>
                <input type="file" id="files" name="files" multiple accept=".pdf,.docx,.txt">
            </div>
            <div class="form-group">
                <label for="url">Website URL (Optional):</label>
                <input type="text" id="url" name="url" placeholder="https://example.com">
            </div>
            <button type="submit">Update Knowledge Base</button>
        </form>
        <div id="statusMessage" class="status-message">
            <!-- Status messages will appear here -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
